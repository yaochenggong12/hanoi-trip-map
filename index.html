<title>하노이 여행 지도</title>

<style>
  :root { --ink:#1f2933; --sub:#6b7780; --line:#e3e7ea; --bg:#f6f7f8; --card:#fff; --accent:#d9480f; --accent-soft:#fff1e8; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; color:var(--ink); background:var(--bg); display:flex; flex-direction:column; }
  header { padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; margin-right:auto; }
  header h1 small { font-weight:400; color:var(--sub); font-size:12px; margin-left:6px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 10px; color:var(--ink); }
  button:hover { border-color:var(--accent); }
  .tabs { display:flex; gap:6px; padding:8px 16px; background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; }
  .tabs button { white-space:nowrap; border-radius:999px; padding:6px 14px; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:400px 1fr; }
  #panel { overflow-y:auto; padding:12px 16px 24px; border-right:1px solid var(--line); background:var(--bg); }
  #map { min-height:0; }
  .dayhead { display:flex; align-items:baseline; gap:8px; margin:4px 0 10px; }
  .dayhead h2 { font-size:16px; margin:0; }
  .dayhead span { color:var(--sub); font-size:13px; }
  .stop { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:8px; display:grid; grid-template-columns:28px 1fr; gap:8px; }
  .stop.picking { border-color:var(--accent); background:var(--accent-soft); }
  .stop.active { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .stop.has-pos { cursor:pointer; }
  .row1 { flex-wrap:wrap; }
  .row1 .title { flex:1 1 180px; min-width:0; }
  .num { width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .num.none { background:#c5ccd1; }
  .row1 { display:flex; gap:6px; align-items:center; }
  .stop input, .stop textarea { font:inherit; border:1px solid transparent; border-radius:6px; padding:3px 5px; background:transparent; color:var(--ink); width:100%; }
  .stop input:hover, .stop textarea:hover, .stop input:focus, .stop textarea:focus { border-color:var(--line); background:#fff; outline:none; }
  .stop input[type=time] { width:124px; flex:none; font-weight:600; color:var(--accent); }
  .stop .title { font-weight:600; }
  .stop textarea { font-size:13px; color:var(--sub); resize:none; overflow:hidden; line-height:1.45; }
  .tip { margin:4px 0 2px; font-size:13px; }
  .tip summary { cursor:pointer; color:var(--accent); font-weight:600; padding:3px 5px; width:max-content; }
  .tip p { margin:4px 0 0; padding:8px 10px; background:var(--accent-soft); border-radius:8px; line-height:1.6; color:var(--ink); }
  .acts { display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; }
  .acts button, .acts a { font-size:12px; padding:3px 8px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--sub); text-decoration:none; }
  .acts a:hover, .acts button:hover { color:var(--accent); border-color:var(--accent); }
  .add { width:100%; padding:10px; border-style:dashed; color:var(--sub); }
  .hint { font-size:12px; color:var(--sub); margin:10px 2px 0; line-height:1.5; }
  .banner { display:none; position:absolute; z-index:1000; left:50%; transform:translateX(-50%); top:10px; background:var(--accent); color:#fff; padding:8px 14px; border-radius:999px; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  .mapwrap { position:relative; min-height:0; }
  .mapwrap #map { position:absolute; inset:0; }
  .pin { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .cand { width:14px; height:14px; border-radius:50%; background:#5c7c99; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .leaflet-popup-content { font-family:inherit; font-size:13px; margin:10px 12px; }
  .leaflet-popup-content b { font-size:14px; }
  .leaflet-popup-content button { margin-top:6px; font-size:12px; padding:4px 8px; }
  dialog { border:none; border-radius:14px; padding:20px; width:min(440px, calc(100vw - 32px)); box-shadow:0 10px 40px rgba(0,0,0,.3); color:var(--ink); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog h3 { margin:0 0 6px; font-size:16px; }
  dialog p { margin:0 0 12px; font-size:13px; color:var(--sub); line-height:1.5; }
  dialog input { width:100%; font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; }
  dialog input:focus { outline:2px solid var(--accent); border-color:transparent; }
  .dlgacts { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  @media (max-width: 760px) {
    main { grid-template-columns:1fr; grid-template-rows:42vh 1fr; }
    .mapwrap { order:-1; }
    #panel { border-right:none; border-top:1px solid var(--line); }
    header h1 small { display:none; }
  }

<body>
<header>
  <h1>하노이 여행 <small>2026.12.3 ~ 12.7 · 수정하면 자동 저장</small></h1>
  <button id="btnKey">구글맵으로 보기</button>
  <button id="btnExport">내보내기</button>
  <button id="btnImport">가져오기</button>
  <button id="btnReset">처음 일정으로</button>
  <input type="file" id="file" accept=".json" hidden>
</header>
<dialog id="keyDlg">
  <form id="keyForm">
    <h3>구글맵 API 키</h3>
    <p>Google Cloud 콘솔에서 복사한 Maps JavaScript API 키를 붙여넣으세요. 키는 이 브라우저에만 저장됩니다.</p>
    <input id="keyInput" type="text" autocomplete="off" spellcheck="false" placeholder="AIza...">
    <div class="dlgacts">
      <button type="button" id="keyClear">무료 지도로 돌아가기</button>
      <span style="flex:1"></span>
      <button type="button" id="keyCancel">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>
<div class="tabs" id="tabs"></div>
<main>
  <section id="panel"></section>
  <div class="mapwrap"><div class="banner" id="banner">지도를 눌러 위치를 정하세요 (저장한 장소 점을 눌러도 됩니다)</div><div id="map"></div></div>
</main>

const tipFor = t => { if (/^Grab/.test(t)) return ''; const hit = TIPS.find(x => t.includes(x[0])); return hit ? hit[1] : ''; };

const KEY = 'hanoi-trip-v2';
let uid = 0;
const withIds = plan => { for (const d in plan) plan[d].forEach(s => s.id = s.id || ('s' + Date.now() + (uid++))); return plan; };
const clone = o => JSON.parse(JSON.stringify(o));
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return withIds(JSON.parse(raw)); } catch (e) {}
  return withIds(clone(DEFAULT_PLAN));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(plan)); } catch (e) {} }
let plan = load();
let day = DAYS[0].key;
let pickingId = null;   // 지도에서 위치를 찍는 중인 일정

// ───────── 지도 ─────────
// 구글맵 API 키가 저장돼 있으면 구글맵, 없으면 무료 지도(Leaflet)로 그린다.
// 두 지도 모두 같은 4가지 기능만 제공한다: draw(그리기) · focus(이동) · closePopup · resize
const GKEY = 'hanoi-gmaps-key';
const CENTER = { lat:21.0335, lng:105.8490 };
const gmaps = s => 'https://www.google.com/maps/search/?api=1&query=' + s.lat + ',' + s.lng;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const stops = () => plan[day];
const sortStops = () => stops().sort((a, b) => a.time.localeCompare(b.time));
const stopPopup = s => '<b>' + esc(s.time + ' ' + s.title) + '</b><br>' + esc(s.memo) + '<br><a target="_blank" href="' + gmaps(s) + '">구글맵에서 열기</a>';
const candPopup = (p, idx) => '<b>' + esc(p.name) + '</b><br>' + esc(p.memo) + '<br><button onclick="addFromPlace(' + idx + ')">이 날 일정에 추가</button>';
const moved = (s, lat, lng) => { s.lat = lat; s.lng = lng; save(); render(false); };
// 미리보기 창처럼 confirm/alert이 막힌 곳에서도 멈추지 않게 감싼다
const ask = m => { try { return confirm(m); } catch (e) { return true; } };
const say = m => { try { alert(m); } catch (e) { console.warn(m); } };
let M = null;   // 현재 사용 중인 지도
let marks = {}; // 일정 id → 지도 핀 (카드를 누르면 해당 핀으로 이동하기 위해 기억해 둔다)
// 목록의 카드를 강조하고 보이는 곳으로 스크롤한다 (핀을 눌렀을 때도 호출)
function hilite(id) {
  document.querySelectorAll('.stop.active').forEach(el => el.classList.remove('active'));
  const el = document.querySelector('.stop[data-id="' + id + '"]');
  if (el) { el.classList.add('active'); el.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
}

function leafletMap() {
  const map = L.map('map').setView([CENTER.lat, CENTER.lng], 15);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom:19, subdomains:'abcd', attribution:'© OpenStreetMap © CARTO' }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  map.on('click', e => { if (pickingId) setPos(e.latlng.lat, e.latlng.lng); });
  return {
    draw(fit) {
      layer.clearLayers(); marks = {};
      const located = stops().filter(s => s.lat != null);
      const pts = located.map(s => [s.lat, s.lng]);
      if (pts.length > 1) L.polyline(pts, { color:'#d9480f', weight:3, opacity:.6, dashArray:'6 6' }).addTo(layer);
      located.forEach((s, i) => {
        const m = L.marker([s.lat, s.lng], { draggable:true, icon:L.divIcon({ className:'', html:'<div class="pin">' + (i + 1) + '</div>', iconSize:[28, 28], iconAnchor:[14, 14] }) });
        m.bindPopup(stopPopup(s));
        m.on('click', () => hilite(s.id));
        m.on('dragend', () => { const p = m.getLatLng(); moved(s, p.lat, p.lng); });
        m.addTo(layer); marks[s.id] = m;
      });
      PLACES.forEach((p, idx) => {
        const m = L.marker([p.lat, p.lng], { icon:L.divIcon({ className:'', html:'<div class="cand"></div>', iconSize:[14, 14], iconAnchor:[7, 7] }), zIndexOffset:-500 });
        m.bindPopup(candPopup(p, idx));
        m.on('click', () => { if (pickingId) { setPos(p.lat, p.lng, p.name); m.closePopup(); } });
        m.addTo(layer);
      });
      if (fit && pts.length && map.getSize().y > 0) map.fitBounds(L.latLngBounds(pts).pad(0.25), { maxZoom:16 });
    },
    focus: s => { map.flyTo([s.lat, s.lng], 17, { duration:.6 }); if (marks[s.id]) marks[s.id].openPopup(); },
    closePopup: () => map.closePopup(),
    resize: () => map.invalidateSize(),
  };
}

function googleMap() {
  const G = google.maps;
  const map = new G.Map(document.getElementById('map'), { center:CENTER, zoom:15, mapTypeControl:false, streetViewControl:false, fullscreenControl:false, gestureHandling:'greedy', clickableIcons:false });
  const info = new G.InfoWindow();
  let items = [];
  const dot = (color, scale) => ({ path:G.SymbolPath.CIRCLE, scale, fillColor:color, fillOpacity:1, strokeColor:'#fff', strokeWeight:2 });
  map.addListener('click', e => { if (pickingId) setPos(e.latLng.lat(), e.latLng.lng()); else info.close(); });
  return {
    draw(fit) {
      items.forEach(o => o.setMap(null)); items = []; marks = {}; info.close();
      const located = stops().filter(s => s.lat != null);
      const pts = located.map(s => ({ lat:s.lat, lng:s.lng }));
      if (pts.length > 1) items.push(new G.Polyline({ map, path:pts, strokeColor:'#d9480f', strokeOpacity:.6, strokeWeight:3 }));
      PLACES.forEach((p, idx) => {
        const m = new G.Marker({ map, position:p, icon:dot('#5c7c99', 6), zIndex:1, title:p.name });
        m.addListener('click', () => { if (pickingId) return setPos(p.lat, p.lng, p.name); info.setContent(candPopup(p, idx)); info.open({ map, anchor:m }); });
        items.push(m);
      });
      located.forEach((s, i) => {
        const m = new G.Marker({ map, position:{ lat:s.lat, lng:s.lng }, draggable:true, zIndex:100 + i, icon:dot('#d9480f', 13), label:{ text:String(i + 1), color:'#fff', fontWeight:'700', fontSize:'12px' } });
        m.addListener('click', () => { info.setContent(stopPopup(s)); info.open({ map, anchor:m }); hilite(s.id); });
        m.addListener('dragend', () => { const p = m.getPosition(); moved(s, p.lat(), p.lng()); });
        items.push(m); marks[s.id] = m;
      });
      if (fit && pts.length) {
        if (pts.length === 1) { map.setCenter(pts[0]); map.setZoom(16); return; }
        const b = new G.LatLngBounds(); pts.forEach(p => b.extend(p)); map.fitBounds(b, 60);
        G.event.addListenerOnce(map, 'idle', () => { if (map.getZoom() > 16) map.setZoom(16); });
      }
    },
    focus: s => { map.setZoom(17); map.panTo({ lat:s.lat, lng:s.lng }); if (marks[s.id]) { info.setContent(stopPopup(s)); info.open({ map, anchor:marks[s.id] }); } },
    closePopup: () => info.close(),
    resize: () => {},
  };
}
function drawMap(fit) { if (M) M.draw(fit); }

function setPos(lat, lng, name) {
  const s = stops().find(s => s.id === pickingId); if (!s) return;
  s.lat = lat; s.lng = lng;
  if (name && (!s.title || s.title === '새 일정')) s.title = name;
  pickingId = null; save(); render(false);
}
window.addFromPlace = idx => {
  const p = PLACES[idx];
  const last = stops()[stops().length - 1];
  stops().push(withStop({ time: last ? plusHour(last.time) : '09:00', title:p.name, memo:p.memo, lat:p.lat, lng:p.lng }));
  M.closePopup(); sortStops(); save(); render(false);
};
const withStop = s => (s.id = 's' + Date.now() + (uid++), s);
const plusHour = t => { const [h, m] = t.split(':').map(Number); return String(Math.min(h + 1, 23)).padStart(2, '0') + ':' + String(m).padStart(2, '0'); };

// ───────── 목록 ─────────
const panel = document.getElementById('panel');
function render(fit) {
  document.getElementById('tabs').innerHTML = DAYS.map(d => '<button class="' + (d.key === day ? 'on' : '') + '" data-day="' + d.key + '">' + d.label + '</button>').join('');
  const d = DAYS.find(d => d.key === day);
  let n = 0;
  panel.innerHTML = '<div class="dayhead"><h2>' + d.title + '</h2><span>' + d.sub + '</span></div>' +
    stops().map(s => {
      const has = s.lat != null; if (has) n++;
      return '<div class="stop' + (s.id === pickingId ? ' picking' : '') + (has ? ' has-pos' : '') + '" data-id="' + s.id + '">' +
        '<div class="num' + (has ? '' : ' none') + '">' + (has ? n : '·') + '</div><div>' +
        '<div class="row1"><input type="time" data-f="time" value="' + s.time + '"><input class="title" data-f="title" value="' + esc(s.title) + '" placeholder="일정 이름"></div>' +
        '<textarea data-f="memo" rows="1" placeholder="메모">' + esc(s.memo) + '</textarea>' +
        (tipFor(s.title) ? '<details class="tip"><summary>특징 · 메뉴 · 후기</summary><p>' + esc(tipFor(s.title)).replace(/\n/g, '<br>') + '</p></details>' : '') +
        '<div class="acts">' +
          (has ? '<button data-a="show">지도에서 보기</button><a target="_blank" href="' + gmaps(s) + '">구글맵</a>' : '') +
          '<button data-a="pick">' + (s.id === pickingId ? '위치 찍기 취소' : (has ? '위치 바꾸기' : '위치 찍기')) + '</button>' +
          '<button data-a="del">삭제</button>' +
        '</div></div></div>';
    }).join('') +
    '<button class="add" id="btnAdd">+ 일정 추가</button>' +
    '<p class="hint">시간을 바꾸면 순서가 자동으로 정렬됩니다. 지도의 번호 핀은 끌어서 옮길 수 있고, 파란 점은 구글맵 리스트에 저장해 둔 장소입니다.</p>';
  panel.querySelectorAll('textarea').forEach(grow);
  const bn = document.getElementById('banner'); if (!bn.dataset.notice) bn.style.display = pickingId ? 'block' : 'none';
  drawMap(fit);
}
const grow = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };

document.getElementById('tabs').addEventListener('click', e => {
  const k = e.target.dataset.day; if (!k) return;
  day = k; pickingId = null; render(true); panel.scrollTop = 0;
});
panel.addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f || f === 'time') return;
  const s = stops().find(s => s.id === e.target.closest('.stop').dataset.id);
  s[f] = e.target.value; if (f === 'memo') grow(e.target); save();
});
panel.addEventListener('change', e => {
  const f = e.target.dataset.f; if (!f) return;
  const s = stops().find(s => s.id === e.target.closest('.stop').dataset.id);
  if (f === 'time') { if (!e.target.value) { e.target.value = s.time; return; } s.time = e.target.value; sortStops(); }
  save(); render(false);
});
panel.addEventListener('click', e => {
  if (e.target.id === 'btnAdd') {
    const last = stops()[stops().length - 1];
    const s = withStop({ time: last ? plusHour(last.time) : '09:00', title:'새 일정', memo:'' });
    stops().push(s); sortStops(); save(); render(false);
    const el = panel.querySelector('[data-id="' + s.id + '"] .title'); if (el) { el.focus(); el.select(); }
    return;
  }
  const card = e.target.closest('.stop'); if (!card) return;
  const id = card.dataset.id;
  const s = stops().find(s => s.id === id);
  const a = e.target.dataset.a;
  if (!a) {   // 카드의 빈 곳이나 번호를 누르면 지도에서 그 위치로 이동
    if (!e.target.closest('input, textarea, a, button, details') && s.lat != null && !pickingId) { hilite(id); M.focus(s); }
    return;
  }
  if (a === 'del') { if (ask('"' + s.title + '" 일정을 삭제할까요?')) { plan[day] = stops().filter(x => x.id !== id); save(); render(false); } }
  if (a === 'pick') { pickingId = pickingId === id ? null : id; render(false); }
  if (a === 'show') { hilite(id); M.focus(s); }
});

// ───────── 내보내기 · 가져오기 · 초기화 ─────────
document.getElementById('btnExport').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(plan, null, 2)], { type:'application/json' }));
  a.download = '하노이-일정.json'; a.click();
};
const file = document.getElementById('file');
document.getElementById('btnImport').onclick = () => file.click();
file.onchange = async () => {
  try {
    const data = JSON.parse(await file.files[0].text());
    if (!DAYS.every(d => Array.isArray(data[d.key]))) throw new Error();
    plan = withIds(data); save(); render(true);
  } catch (e) { say('일정 파일을 읽을 수 없습니다.'); }
  file.value = '';
};
document.getElementById('btnReset').onclick = () => {
  if (ask('수정한 내용을 모두 지우고 처음 일정으로 되돌릴까요?')) { plan = withIds(clone(DEFAULT_PLAN)); save(); render(true); }
};

// ───────── 구글맵 키 설정 · 시작 ─────────
const getKey = () => { try { return localStorage.getItem(GKEY) || ''; } catch (e) { return ''; } };
const setKey = k => { try { k ? localStorage.setItem(GKEY, k) : localStorage.removeItem(GKEY); } catch (e) {} };
const btnKey = document.getElementById('btnKey');
btnKey.textContent = getKey() ? '구글맵 사용 중' : '구글맵으로 보기';
const dlg = document.getElementById('keyDlg'), keyInput = document.getElementById('keyInput');
btnKey.onclick = () => { keyInput.value = getKey(); dlg.showModal(); keyInput.focus(); };
document.getElementById('keyCancel').onclick = () => dlg.close();
document.getElementById('keyClear').onclick = () => { setKey(''); location.reload(); };
document.getElementById('keyForm').onsubmit = e => { e.preventDefault(); setKey(keyInput.value.trim()); location.reload(); };
function start(make) {
  M = make(); render(true);
  // 지도 칸 크기가 정해지거나 바뀔 때(창 크기 조절, 휴대폰 회전) 지도를 다시 맞춘다
  let first = true;
  new ResizeObserver(() => { M.resize(); if (first) { first = false; drawMap(true); } }).observe(document.getElementById('map'));
}
// 키가 틀리면 저장된 키를 지우고 무료 지도로 돌아간 뒤, 이유를 화면 위 띠로 알려준다
function fallback(msg) { setKey(''); try { sessionStorage.setItem('hanoi-notice', msg + ' 무료 지도로 돌아왔습니다.'); } catch (e) {} location.reload(); }
try {
  const n = sessionStorage.getItem('hanoi-notice');
  if (n) { sessionStorage.removeItem('hanoi-notice'); const b = document.getElementById('banner'); b.textContent = n; b.style.display = 'block'; b.dataset.notice = '1'; setTimeout(() => { delete b.dataset.notice; b.style.display = 'none'; b.textContent = '지도를 눌러 위치를 정하세요 (저장한 장소 점을 눌러도 됩니다)'; }, 8000); }
} catch (e) {}
if (getKey()) {
  window.gm_authFailure = () => fallback('구글맵 API 키가 올바르지 않거나, 이 키에 Maps JavaScript API가 켜져 있지 않습니다.');
  window.gmReady = () => start(googleMap);
  const sc = document.createElement('script');
  sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(getKey()) + '&language=ko&region=KR&callback=gmReady';
  sc.onerror = () => fallback('구글맵을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
  document.head.appendChild(sc);
} else {
  start(leafletMap);
}
</script>
